name: Mobile CI

on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development, master, 'feature/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate coverage collection and source maps
        run: npm run test:coverage:check

      - name: Unit and component tests with line and branch coverage
        run: npm run test:coverage

      - name: Publish code coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-code-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 30

      - name: TypeScript
        run: npm run typecheck

      - name: Component test TypeScript
        run: npm run typecheck:components

      - name: ESLint
        run: npm run lint
