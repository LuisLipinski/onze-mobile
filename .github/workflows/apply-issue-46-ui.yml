name: Apply issue 46 UI patch

on:
  push:
    branches:
      - fix/minimum-player-decision-ui
    paths:
      - scripts/apply_issue_46_ui.py
      - .github/workflows/apply-issue-46-ui.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: python3 scripts/apply_issue_46_ui.py

      - name: Remove temporary patch files
        run: |
          rm scripts/apply_issue_46_ui.py
          rm .github/workflows/apply-issue-46-ui.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: tratar partida abaixo do mínimo no app"
          git push origin HEAD:${GITHUB_REF_NAME}
